<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#111111" />
    <meta name="description" content="Mango DeFi - Multi-Chain DEX & Cross-Chain Swap" />
    <meta name="telegram-web-app-capable" content="yes" />
    <link rel="icon" href="/mango-token.svg" type="image/svg+xml" />
    <title>Mango DeFi - Swap</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Fix "Illegal invocation" when Reown/WalletConnect access provider in iframe/WebView (e.g. Telegram).
      // Use a getter/setter so we wrap window.ethereum whenever it is set (e.g. async MetaMask inject).
      (function () {
        if (typeof window === 'undefined') return;
        var realEthereum = window.ethereum;
        function wrapProvider(target) {
          if (!target || typeof target !== 'object') return target;
          try {
            return new Proxy(target, {
              get: function (t, prop) {
                var val = Reflect.get(t, prop, t);
                if (typeof val === 'function') return val.bind(t);
                if (val && typeof val === 'object' && prop !== 'constructor' && !(val instanceof Date)) return wrapProvider(val);
                return val;
              }
            });
          } catch (e) { return target; }
        }
        try {
          Object.defineProperty(window, 'ethereum', {
            get: function () { return realEthereum ? wrapProvider(realEthereum) : realEthereum; },
            set: function (v) { realEthereum = v; },
            configurable: true
          });
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
