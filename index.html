<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#111111" />
    <meta name="description" content="Mango DeFi - Multi-Chain DEX & Cross-Chain Swap" />
    <meta name="telegram-web-app-capable" content="yes" />
    <title>Mango DeFi - Swap</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Fix "Illegal invocation" when Reown/WalletConnect access window.ethereum in iframe/WebView (e.g. Telegram).
      // Getters like .connected must run with correct 'this'; bound references can lose context.
      (function () {
        if (typeof window === 'undefined' || !window.ethereum) return;
        var orig = window.ethereum;
        window.ethereum = new Proxy(orig, {
          get: function (target, prop) {
            var val = Reflect.get(target, prop, target);
            if (typeof val === 'function') return val.bind(target);
            return val;
          }
        });
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
